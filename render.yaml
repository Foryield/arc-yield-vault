# Render Blueprint: static demo site for arc.for-yield.com.
# Public values only: vault addresses and the public Arc testnet RPC. No secret belongs here.
services:
  - type: web
    name: foryield-arc-demo
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    domains:
      - arc.for-yield.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_USDC_VAULT
        value: "0xBbc099E29069e71C1A52C2e9d74328096Fc4e4a7"
      - key: NEXT_PUBLIC_EURC_VAULT
        value: "0x623B4e264CB217763dDD71a1ec597c0926Cb902c"
      - key: NEXT_PUBLIC_ARC_RPC_URL
        value: https://rpc.testnet.arc.io
    headers:
      # Next.js inlines its bootstrap scripts, with hashes that change on every build, hence
      # 'unsafe-inline'; no external script origin is allowed. The page only calls the Arc RPC.
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://rpc.testnet.arc.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=()
